server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: civics-resource-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/civics_resources?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:resource_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5
