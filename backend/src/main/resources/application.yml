server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  config:
    import: optional:file:./config/application-local.yml
  application:
    name: civics-resource-management
  servlet:
    multipart:
      max-file-size: ${RESOURCE_MAX_FILE_SIZE:20MB}
      max-request-size: ${RESOURCE_MAX_REQUEST_SIZE:21MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/management-system?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:resource_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5

app:
  resource-storage:
    directory: ${RESOURCE_STORAGE_DIR:./uploads/resources}
    max-size: ${RESOURCE_MAX_FILE_SIZE:20MB}
    allowed-extensions: pdf,doc,docx,ppt,pptx,xls,xlsx,jpg,jpeg,png
